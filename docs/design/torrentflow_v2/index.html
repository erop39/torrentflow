x;margin-bottom:16px}.chip,.card{background:linear-gradient(145deg,#ffffff0c,#ffffff03);border:1px solid #ffffff12;border-radius:14px}.chip{padding:14px;display:flex;gap:10px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.dot.warn{background:var(--orange);box-shadow:none}.chip strong{display:block;font-size:13px}.chip small{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.85fr);gap:16px}.card{padding:20px}.card h2{font-size:16px;margin:0}.flow{margin-top:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:0}.stage{padding:16px;border-top:2px solid var(--line);position:relative}.stage:before{content:"";position:absolute;top:-5px;left:0;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}.stage strong{display:block;font-size:28px;margin-top:10px}.stage span{color:var(--muted);font-size:12px}.chart{height:180px;margin-top:16px;background:linear-gradient(180deg,#00f4fe15,transparent);border-radius:9px;position:relative;overflow:hidden}.chart svg{width:100%;height:100%}.chart-label{position:absolute;top:12px;left:12px}.metric{font-size:29px;font-weight:700}.list{margin-top:12px}.row{display:grid;grid-template-columns:1.6fr .8fr .7fr .7fr auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid #ffffff10}.row:first-child{border-top:0}.row small{color:var(--muted)}.badge{font:600 11px 'JetBrains Mono';padding:5px 8px;border-radius:999px;background:#00f4fe14;color:var(--cyan);white-space:nowrap}.badge.warn{background:#ffb4a21a;color:var(--orange)}.attention{border-left:3px solid var(--orange)}.table-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.screen-copy{color:var(--muted);margin:4px 0 22px;max-width:680px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:grid;gap:7px}.field label{font-weight:600}.field input,.field select{background:var(--deep);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.mobile-nav{display:none}@media(max-width:800px){.shell{grid-template-columns:1fr}.rail{display:none}.main{padding:20px 16px 90px}.health{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.row>:not(:first-child):not(:last-child){display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;justify-content:space-around;padding:8px;background:#0b0e16ed;backdrop-filter:blur(14px);border-top:1px solid #ffffff16}.mobile-nav button{min-width:44px;min-height:44px;background:none;border:0;color:var(--muted);font-size:11px}.mobile-nav button[aria-current="page"]{color:var(--cyan)}.top{align-items:flex-start}.actions .btn:not(.primary){display:none}.form-grid{grid-template-columns:1fr}}
    .category-tag{display:inline-flex;align-items:center;gap:6px;margin-top:5px;color:var(--muted);font:600 10px 'JetBrains Mono';letter-spacing:.05em;text-transform:uppercase}.category-dot{width:7px;height:7px;border-radius:50%;background:var(--category-color,#00f4fe);box-shadow:0 0 8px var(--category-color,#00f4fe)}.category-colors{margin-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.category-color{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid #ffffff12;background:#ffffff05;border-radius:10px}.category-color label{display:flex;align-items:center;gap:8px;font-weight:600}.category-color input{width:30px;height:30px;padding:0;border:0;background:none;cursor:pointer}
    /* The attention copy needs air beneath its title, especially on wrapped errors. */
    .attention .mono{display:block;margin-bottom:5px}.attention h2{margin:0 0 10px;line-height:1.3}.attention .screen-copy{margin:0 0 18px}

const nav=document.getElementById('nav'),mobile=document.getElementById('mobileNav'),pages=document.getElementById('pages');pages.innerHTML=Object.values(body).join('');items.forEach(([id,label,icon],i)=>{let b=`<button data-go="${id}" title="${label}" aria-label="${label}"><i data-lucide="${icon}" aria-hidden="true"></i></button>`;nav.innerHTML+=i===5?'<div class="sep"></div>'+b:b; if(i<4||id==='settings')mobile.innerHTML+=`<button data-go="${id}" aria-label="${label}"><i data-lucide="${icon}" aria-hidden="true"></i><br>${label}</button>`});document.addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-go]').forEach(x=>x.toggleAttribute('aria-current',x.dataset.go===id));document.getElementById('title').textContent=items.find(x=>x[0]===id)[1]}function showToast(t){let x=document.createElement('div');x.textContent=t;x.style.cssText='position:fixed;right:20px;bottom:22px;background:#1c2028;border:1px solid #00f4fe66;color:#e0e2ed;padding:13px 16px;border-radius:9px;box-shadow:0 12px 35px #0008;z-index:9';document.body.append(x);setTimeout(()=>x.remove(),2500)}lucide.createIcons({attrs:{'stroke-width':1.8}});go('dashboard');

  const actionIcons = [

</script><script>
  const categoryColors = { series: '#ad8cff', linux: '#69e5a5' };
  const categoryFor = title => title.includes('Arcane') ? 'series' : 'linux';
  function paintCategories() {
    document.querySelectorAll('#dashboard .row strong, #releases .row strong').forEach(title => {
      const category = categoryFor(title.textContent);
      const row = title.closest('.row');
      row.style.setProperty('--category-color', categoryColors[category]);
      if (!title.parentElement.querySelector('.category-tag')) title.insertAdjacentHTML('afterend', `<span class="category-tag"><i class="category-dot"></i>${category}</span>`);

  document.querySelectorAll('[data-category]').forEach(input => input.addEventListener('input', event => { categoryColors[event.target.dataset.category] = event.target.value; paintCategories(); }));

</script><script>
  const searchIndex = [
    { title: 'Arcane.S02E01.2160p.WEB', detail: 'Release · series · 18.2 GB', page: 'releases' },

  document.body.insertAdjacentHTML('beforeend', `<div class="search-backdrop" hidden><section class="search-card" role="dialog" aria-modal="true" aria-labelledby="search-title"><div class="search-heading"><div><div class="mono">Quick search</div><h2 id="search-title">Find a release, feed or rule</h2></div><button class="btn" type="button" data-search-close>Close</button></div><label class="search-field"><i data-lucide="search" aria-hidden="true"></i><input type="search" placeholder="Start typing…" autocomplete="off" aria-label="Search TorrentFlow"></label><div class="search-results" aria-live="polite"></div><small class="search-hint">Enter opens the first result · Esc closes</small></section></div><style>.search-backdrop[hidden]{display:none}.search-backdrop{position:fixed;inset:0;z-index:21;background:#05070a99;backdrop-filter:blur(5px);display:grid;place-items:start center;padding:clamp(72px,14vh,150px) 16px 16px}.search-card{width:min(620px,100%);background:var(--panel);border:1px solid #ffffff20;border-radius:16px;padding:20px;box-shadow:0 24px 80px #000b}.search-heading{display:flex;align-items:start;justify-content:space-between;gap:16px}.search-heading h2{margin:4px 0 0;font-size:18px}.search-field{display:flex;align-items:center;gap:10px;margin-top:18px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--deep)}.search-field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px #adc6ff1a}.search-field svg{width:17px;color:var(--muted)}.search-field input{width:100%;padding:13px 0;border:0;outline:0;background:transparent;color:var(--text);font:inherit}.search-results{display:grid;gap:6px;margin-top:12px}.search-result{display:grid;gap:3px;width:100%;padding:11px 12px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--text);text-align:left;cursor:pointer}.search-result:hover,.search-result:focus-visible{border-color:#adc6ff66;background:#ffffff09;outline:2px solid transparent}.search-result small,.search-hint{color:var(--muted)}.search-hint{display:block;margin-top:14px;font-size:12px}@media(max-width:800px){.search-backdrop{padding-top:72px}.search-card{padding:16px}.search-heading h2{font-size:16px}}</style>`);
  lucide.createIcons({attrs:{'stroke-width':1.8}});
  const searchModal = document.querySelector('.search-backdrop');
  const searchInput = searchModal.querySelector('input');
  const searchResults = searchModal.querySelector('.search-results');
  const renderSearch = query => {
    const matches = searchIndex.filter(item => `${item.title} ${item.detail}`.toLowerCase().includes(query.trim().toLowerCase()));
    searchResults.innerHTML = matches.length ? matches.map(item => `<button type="button" class="search-result" data-search-page="${item.page}"><strong>${item.title}</strong><small>${item.detail}</small></button>`).join('') : '<div class="empty">No matching releases, feeds or rules.</div>';
  };
  const openSearch = () => { searchModal.hidden = false; renderSearch(''); searchInput.focus(); };
  const closeSearch = () => { searchModal.hidden = true; document.querySelector('[data-search]').focus(); };
  document.querySelector('[data-search]').addEventListener('click', openSearch);
  searchModal.addEventListener('click', event => { if (event.target === searchModal || event.target.closest('[data-search-close]')) closeSearch(); const result = event.target.closest('[data-search-page]'); if (result) { go(result.dataset.searchPage); closeSearch(); } });
  searchInput.addEventListener('input', event => renderSearch(event.target.value));
  searchInput.addEventListener('keydown', event => { if (event.key === 'Enter') { const first = searchResults.querySelector('[data-search-page]'); if (first) first.click(); } });
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && !searchModal.hidden) closeSearch(); });
