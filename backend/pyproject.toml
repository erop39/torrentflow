[project]
name = "torrentflow-backend"
version = "0.1.0"
description = "LAN-first RSS to qBittorrent control room"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "aiosqlite>=0.20,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
